<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>COS — Offline</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #0a0a0a; color: #ededed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      .card { max-width: 320px; }
      h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; opacity: 0.7; margin: 0 0 20px; }
      button {
        appearance: none; border: 0; border-radius: 12px; padding: 12px 20px;
        background: #ededed; color: #0a0a0a; font-size: 15px; font-weight: 600;
      }
      /* The one thing that still works with no connection. A dead end with a
         Retry button on it is not an answer when there is somewhere to go. */
      a.notes {
        display: inline-block; margin-top: 14px; color: #8ab4f8;
        font-size: 14px; text-decoration: none; border-bottom: 1px solid rgba(138,180,248,0.4);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>COS can't reach the network right now. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
      <div><a class="notes" href="/notes/offline">Read and write your notes anyway</a></div>
    </div>
  </body>
</html>
