appId: tz.co.oracle.cos
productName: Oracle Consultancy
copyright: © Oracle Consultancy Ltd

directories:
  output: dist
  buildResources: build

# Only the shell. There is nothing else to ship — no server, no data, no keys.
files:
  - src/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  # electron-builder makes the .ico from this 512px PNG.
  icon: build/icon.png
  # ⚠️ Unsigned for now. Windows will show "Windows protected your PC" on first
  # download until the file earns a reputation — the user clicks
  # "More info" → "Run anyway" once. Auto-updates work unsigned on Windows
  # (unlike macOS, where signing is mandatory). To sign later, add the
  # certificate to the GitHub Actions secrets and set the env vars there; nothing
  # in this file or in the app has to change.

nsis:
  # A real installer, not a silent one-click: people expect to see where it goes.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Oracle Consultancy
  # Keep the user's session and window position when they update.
  deleteAppDataOnUninstall: false

# Where the installed app looks for new versions of ITSELF. The app's CONTENTS
# come from the website and need none of this.
#
# ⚠️ THE REPO NAMED HERE MUST BE PUBLIC. electron-updater reads GitHub Releases
# anonymously; against a private repo every client would need a GitHub token
# shipped inside the app, which is exactly the sort of thing this shell exists to
# avoid. The shell holds no secrets, so publishing it publicly costs nothing.
# The alternative — if nothing at all may be public — is provider "generic"
# pointing at a URL you host. See README.md.
publish:
  provider: github
  owner: shivaaam27
  repo: cos-desktop
