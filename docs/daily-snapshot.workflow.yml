name: Daily snapshot

# COPY THIS FILE TO .github/workflows/daily-snapshot.yml
# It's kept under docs/ in the repo because the PAT used to push doesn't have
# the `workflow` scope. Add it via the GitHub UI (Actions tab → New workflow →
# "set up a workflow yourself", paste the contents below). One-time setup.
#
# Writes one row per company per day into daily_snapshots.
# Schedule: 00:05 UTC every day. Manual run available via workflow_dispatch.
# Requires two repo secrets:
#   - APP_BASE_URL   e.g. https://cos.example.com  (no trailing slash)
#   - CRON_SECRET    matches CRON_SECRET in the app's env
on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call snapshot endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_BASE_URL:-}" ]; then
            echo "APP_BASE_URL secret is missing. Add it under Settings → Secrets → Actions." >&2
            exit 1
          fi
          response=$(curl --fail --silent --show-error \
            --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET:-}" \
            "${APP_BASE_URL}/api/cron/snapshot")
          echo "Response: $response"
