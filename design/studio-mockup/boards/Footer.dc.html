<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Footer — page navigator</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1416px; height: 64px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; padding: 0 8px; background: #0E0F10; color: #F2F2F0; font-family: 'Geist', system-ui, sans-serif">
<div style="min-width: 0">
<div style="font-size: 11px; color: #8E9197">{{leftLabel}}</div>
<div style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{leftText}}</div>
</div>
<nav aria-label="Pages" style="display: flex; align-items: center; gap: 22px; font-size: 13px">
<a href="Home.dc.html" style="display: flex; align-items: center; gap: 7px; color: {{homeColor}}; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<div style="display: flex; align-items: center; gap: 4px; background: #1C1D20; border: 1px solid #2A2C30; border-radius: 12px; padding: 3px">
<a href="{{prevHref}}" aria-label="Previous page: {{prevLabel}}" title="{{prevLabel}}" style="width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #A3A6AB"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<a href="GoTo.dc.html" style="height: 28px; min-width: 96px; padding: 0 12px; border-radius: 9px; background: #2A2C30; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; color: #FFFFFF; text-decoration: none">{{page}}<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 15l-6-6-6 6"></path></svg></a>
<a href="{{nextHref}}" aria-label="Next page: {{nextLabel}}" title="{{nextLabel}}" style="width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #A3A6AB"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></a>
</div>
<a href="Settings.dc.html" style="display: flex; align-items: center; gap: 7px; color: {{setColor}}; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>Settings</a>
</nav>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px">
<button type="button" aria-label="Ask ORI or search everything (⌘K)" style="height: 36px; padding: 0 10px 0 12px; border-radius: 10px; border: 1px solid #2A2C30; background: transparent; color: #A3A6AB; font: inherit; font-size: 12px; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span style="color: #C9CBCF; min-width: 120px; text-align: left">Ask or search</span><span style="font-size: 11px; padding: 1px 6px; border-radius: 5px; background: #1F2023; color: #8E9197">⌘K</span></button>
<button type="button" aria-label="Notifications" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #2A2C30; background: transparent; color: #C9CBCF; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 4px; background: #E0479E"></span></button>
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 0; background: #F2F2F0; color: #111214; font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>{{action}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"page":{"editor":"text","default":"Tasks"},"$preview":{"width":1416,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const ORDER = [
      ['Home', 'Home.dc.html'], ['Tasks', 'Main.dc.html'], ['Recurring', 'Recurring.dc.html'], ['Notes', 'Notes.dc.html'],
      ['Outbox', 'Outbox.dc.html'], ['Calendar', 'Calendar.dc.html'], ['Director Brief', 'Brief.dc.html'], ['Announcements', 'Announcements.dc.html'],
      ['People', 'People.dc.html'], ['Companies', 'Companies.dc.html'], ['Documents', 'Documents.dc.html'], ['Assets & Vendors', 'Assets.dc.html'],
      ['Attendance', 'Attendance.dc.html'], ['Supplies', 'Supplies.dc.html'], ['Cleaning', 'Cleaning.dc.html'],
      ['Insights', 'Insights.dc.html'], ['Activity log', 'Activity.dc.html'], ['ORI Automation', 'Ori.dc.html'], ['Settings', 'Settings.dc.html']
    ];
    const page = this.props.page || 'Tasks';
    let i = ORDER.findIndex((o) => o[0] === page);
    if (i < 0) i = 1;
    const prev = ORDER[(i + ORDER.length - 1) % ORDER.length];
    const next = ORDER[(i + 1) % ORDER.length];
    return {
      page, prevHref: prev[1], prevLabel: prev[0], nextHref: next[1], nextLabel: next[0],
      leftLabel: this.props.leftLabel || 'Next deadline',
      leftText: this.props.leftText || 'Sat 26 Sept · Bank and TRA Machine Reconciliation',
      action: this.props.action || 'New task',
      homeColor: page === 'Home' ? '#FFFFFF' : '#8E9197',
      setColor: page === 'Settings' ? '#FFFFFF' : '#8E9197'
    };
  }
}
</script>
</body>
</html>
