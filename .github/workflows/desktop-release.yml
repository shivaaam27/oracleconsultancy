name: Windows app

# Builds the installer you hand to somebody. Download it from the run's
# Artifacts, or from the Release when a `desktop-v*` tag is pushed.
#
# The app's CONTENTS come from Vercel and need no build here — this only rebuilds
# the WINDOW, which changes rarely.
#
# ⚠️ It must build exactly what desktop-win/build.cmd builds: framework-dependent
# and NOT single-file. An earlier version of this file used
# `--self-contained true -p:PublishSingleFile=true`, which produces an app that
# Windows Smart App Control BLOCKS OUTRIGHT — a release nobody could run.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Pinned in desktop-win/.config/dotnet-tools.json, so CI and a laptop use
      # the same WiX. Run through `dotnet wix`, never the global wix.exe: Smart
      # App Control blocks the unsigned shim, and dotnet.exe is Microsoft-signed.
      - name: Restore the installer toolset
        working-directory: desktop-win
        run: dotnet tool restore

      - name: Build the app
        working-directory: desktop-win
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o publish-folder

      - name: Package the installer
        working-directory: desktop-win
        run: |
          dotnet wix build installer/Package.wxs -o "installer/out/Oracle Consultancy Setup.msi"
          dotnet wix build installer/Bundle.wxs -ext WixToolset.BootstrapperApplications.wixext -ext WixToolset.Netfx.wixext -o "installer/out/Oracle Consultancy Setup.exe"

      # The checksum COS publishes must match the file people download, so print
      # it here — it is what goes into DESKTOP_SHA256.
      - name: Checksum
        working-directory: desktop-win
        run: |
          $h = (Get-FileHash "installer/out/Oracle Consultancy Setup.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "DESKTOP_SHA256 = $h"
          Write-Host "Paste into src/lib/desktop-release.ts"

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: oracle-consultancy-windows
          path: desktop-win/installer/out/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-win/installer/out/*.exe
