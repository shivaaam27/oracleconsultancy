name: Windows app

# Builds the single .exe you hand to somebody. Download it from the run's
# Artifacts, or from the Release when a `desktop-v*` tag is pushed.
#
# The app's CONTENTS come from Vercel and need no build here — this only rebuilds
# the WINDOW, which changes rarely.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Self-contained on purpose: one file that runs on any Windows 10/11
      # machine with nothing installed first. See desktop-win/README.md.
      - name: Build
        working-directory: desktop-win
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: oracle-consultancy-windows
          path: desktop-win/publish/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-win/publish/*.exe
